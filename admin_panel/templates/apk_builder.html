<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK Builder - ChildSafe Monitor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>ChildSafe Dashboard</h1>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/apk-builder">APK Builder</a>
            <a href="/fcm-console">FCM Console</a>
            <button id="logout-button">Logout</button>
        </nav>
    </header>
    <main>
        <h2>APK Builder</h2>
        <form id="apk-builder-form">
            <label for="app-name">App Name:</label>
            <input type="text" id="app-name" name="app_name" required>

            <label for="package-name">Package Name (e.g., com.example.myapp):</label>
            <input type="text" id="package-name" name="package_name" required>

            <label for="server-ip">Server IP Address:</label>
            <input type="text" id="server-ip" name="server_ip" required>

            <label for="google-services">google-services.json:</label>
            <input type="file" id="google-services" name="google_services_json" accept=".json" required>

            <label for="app-icon">App Icon:</label>
            <input type="file" id="app-icon" name="app_icon" accept="image/png" required>

            <button type="submit">Build Signed APK</button>
        </form>
    </main>
</body>
</html>
