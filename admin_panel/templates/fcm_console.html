<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCM Console - ChildSafe Monitor</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>ChildSafe Dashboard</h1>
        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/apk-builder">APK Builder</a>
            <a href="/fcm-console">FCM Console</a>
            <button id="logout-button">Logout</button>
        </nav>
    </header>
    <main>
        <h2>FCM Diagnostics</h2>
        <div id="fcm-status-container">
            <p><strong>Child Device Token:</strong> <span id="fcm-token">N/A</span></p>
            <p><strong>Last Ping Received:</strong> <span id="last-ping">Never</span></p>
            <p><strong>Command Queue Depth:</strong> <span id="queue-depth">0</span></p>
        </div>
        <div class="send-fcm-command">
            <h3>Send Test Command</h3>
            <input type="text" id="fcm-command-payload" placeholder='{"type": "ping"}'>
            <button id="send-fcm-button">Send Push</button>
        </div>
    </main>
    <script src="/static/fcm_status.js"></script>
</body>
</html>
